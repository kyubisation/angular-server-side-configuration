name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: yarn
          node-version-file: '.nvmrc'
      - run: yarn install --frozen-lockfile --non-interactive
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go version

      - name: 'Build cli'
        run: yarn build:cli

      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const { owner, repo } = context.repo;
            const tag_name = `v${require('./package.json').version}`;
            console.log(`Creating release for ${owner}/${repo} at ${tag_name}`);
            const body = fs.readFileSync('./CHANGELOG.md', 'utf-8')
              .split(/\n## \[\d+\.\d+\.\d+/)[1]
              .replace(/^[\w\W]+?\n/, '')
              .trim();
            const release = await github.rest.repos.createRelease({ owner, repo, tag_name, body });
            const release_id = release.data.id;
            for (const name of fs.readdirSync('./dist/cli')) {
              console.log(`Adding asset ${name}`);
              const data = await fs.readFileSync(`./dist/cli/${name}`);
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name, data });
            }
      - name: 'Publish container image'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u $ --password-stdin

          imageName="ghcr.io/$GITHUB_REPOSITORY"
          version=$(node -p -e "require('./package.json').version")
          yarn build:container \
            --tag $imageName:$version \
            --tag $imageName:latest
          podman push $imageName:$version
          podman push $imageName:latest

  library:
    runs-on: ubuntu-latest
    needs: cli
    permissions:
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: yarn
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install --frozen-lockfile --non-interactive

      - name: 'Build library'
        run: yarn build:lib

      - name: 'Publish: angular-server-side-configuration'
        run: |
          npm install --global npm@latest
          tag=$(node -p -e "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          cd dist/angular-server-side-configuration
          npm publish --tag $tag
